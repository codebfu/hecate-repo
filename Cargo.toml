[package]
name = "hecate-repo"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
description = "Hecate feature repository management CLI"
license = "GPL-3.0-or-later"
authors = ["Gaultier HUBERT"]

[[bin]]
name = "hecate-repo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
